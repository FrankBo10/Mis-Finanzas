<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Política de seguridad: solo se carga código de esta misma app y se PROHÍBE
       cualquier conexión de datos hacia fuera (connect-src 'none'). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Mis Finanzas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de bloqueo / bienvenida -->
  <div id="lock">
    <div class="lock-box">
      <img src="icons/icon-192.png" alt="" width="72" height="72" class="lock-logo">
      <h1 id="lock-title">Mis Finanzas</h1>
      <p id="lock-msg">Cargando…</p>
      <form id="lock-form" novalidate>
        <label class="field">
          <span class="field-label">Contraseña</span>
          <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
        </label>
        <div id="pw-meter" class="meter" hidden><div class="meter-bars"><i></i><i></i><i></i></div><span id="pw-meter-text"></span></div>
        <label class="field" id="pw2-row" hidden>
          <span class="field-label">Repite la contraseña</span>
          <input id="pw2" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false">
        </label>
        <p id="lock-error" class="form-error" role="alert" hidden></p>
        <button id="lock-btn" type="submit" class="btn primary block">Desbloquear</button>
        <button id="bio-btn" type="button" class="btn block" hidden>Desbloquear con Face ID</button>
      </form>
      <div id="setup-extra" hidden>
        <p class="warn-box">⚠️ <b>No hay forma de recuperar la contraseña.</b> Si la olvidas, tus datos se pierden para siempre: nadie más la conoce. Apúntala en un lugar seguro.</p>
        <button id="restore-btn" type="button" class="btn block">Ya tengo una copia de seguridad</button>
        <p id="restore-info" class="row-sub"></p>
      </div>
      <button id="update-btn" type="button" class="btn block" hidden>Hay una versión nueva · Actualizar</button>
      <p id="version-label" class="version"></p>
    </div>
  </div>

  <!-- La app -->
  <div id="app" hidden>
    <main id="main"></main>
    <nav id="tabbar" aria-label="Secciones">
      <button type="button" data-tab="home"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Inicio</button>
      <button type="button" data-tab="tx"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6.5h12M8 12h12M8 17.5h12"/><path d="M4 6.5h.01M4 12h.01M4 17.5h.01"/></svg>Movimientos</button>
      <button type="button" id="add-btn" aria-label="Añadir movimiento"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" data-tab="reports"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>Informes</button>
      <button type="button" data-tab="more"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Más</button>
    </nav>
  </div>

  <div id="sheets"></div>
  <div id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
